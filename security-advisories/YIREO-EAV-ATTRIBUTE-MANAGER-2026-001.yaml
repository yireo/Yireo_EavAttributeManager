summary: Missing ACL checks and input validation allow admin users to configure arbitrary model classes and tables on EAV attributes
details: >
  The EAV Attribute Manager did not declare or enforce ACL resources for viewing, editing and
  deleting EAV attributes, so admin users without a specific grant could change and delete attributes.
  The frontend, source, backend and attribute model fields accepted any class name and the backend
  table accepted any table name. Magento instantiates these classes and uses these tables at runtime,
  which could be abused for object-instantiation gadgets or to read and corrupt data in other tables.
  System attributes could also be deleted or have their code, entity type, backend type, backend
  table or user-defined flag changed, breaking the shop. Version 1.1.0 adds view, edit and delete ACL
  resources below Stores > Attributes and enforces them on the grid and form actions. It only accepts
  existing model classes of the matching EAV type and only the entity's own value table as backend
  table, and it protects system attributes from deletion and from changes to their core fields.
